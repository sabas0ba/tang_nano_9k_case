name: Build design artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.8"
          cache: pip

      - name: Install generation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --no-deps -r requirements-ci.txt

      - name: Generate and test
        run: |
          make all
          make test
          make package

      - name: Upload generated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tang-nano-9k-panel-case-${{ github.sha }}
          path: |
            dist/tang-nano-9k-panel-case-r4.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
