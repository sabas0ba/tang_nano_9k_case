name: Build design artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build reproducible development image
        run: docker build -f Containerfile -t tang-nano-9k-case-dev .

      - name: Generate and test
        run: >-
          docker run --rm --network none
          -v "$PWD:/project" -w /project
          tang-nano-9k-case-dev make check

      - name: Upload generated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tang-nano-9k-panel-case-${{ github.sha }}
          path: |
            dist/tang-nano-9k-panel-case-r4.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
