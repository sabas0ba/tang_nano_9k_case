name: Build design artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install generation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --no-deps -r requirements-ci.txt

      - name: Generate and test
        run: |
          make all
          make test
          make package

      - name: Upload generated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tang-nano-9k-panel-case-${{ github.sha }}
          path: |
            dist/tang-nano-9k-panel-case-r4.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
